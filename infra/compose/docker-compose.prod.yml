name: compose

services:
  postgres:
    image: postgres:16.4
    container_name: ticketforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VM env file}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in the VM env file}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in the VM env file}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in the VM env file}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in the VM env file}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in the VM env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init-prod.sh:/docker-entrypoint-initdb.d/00-init-prod.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 768m
    cpus: 0.5

  redis:
    image: redis:7.2-bookworm
    container_name: ticketforge-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the VM env file}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    cpus: 0.25

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ticketforge-rabbitmq
    hostname: 1f4a7d8d5463
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in the VM env file}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in the VM env file}
    command: ["bash", "-lc", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    mem_limit: 512m
    cpus: 0.5

  migrate-auth:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-auth-migrate:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migration
      args:
        APP: auth
    command: ["node", "scripts/migrate.mjs", "auth"]
    environment:
      AUTH_DATABASE_URL: postgresql://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/auth
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    cpus: 0.5

  migrate-catalog:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-catalog-migrate:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migration
      args:
        APP: catalog
    command: ["node", "scripts/migrate.mjs", "catalog"]
    environment:
      CATALOG_DATABASE_URL: postgresql://catalog_svc:${CATALOG_DB_PASSWORD}@postgres:5432/catalog
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    cpus: 0.5

  migrate-booking:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-booking-migrate:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migration
      args:
        APP: booking
    command: ["node", "scripts/migrate.mjs", "booking"]
    environment:
      BOOKING_DATABASE_URL: postgresql://booking_svc:${BOOKING_DB_PASSWORD}@postgres:5432/booking
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    cpus: 0.5

  migrate-payment:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-payment-migrate:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migration
      args:
        APP: payment
    command: ["node", "scripts/migrate.mjs", "payment"]
    environment:
      PAYMENT_DATABASE_URL: postgresql://payment_svc:${PAYMENT_DB_PASSWORD}@postgres:5432/payment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    cpus: 0.5

  migrate-notification:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-notification-migrate:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migration
      args:
        APP: notification
    command: ["node", "scripts/migrate.mjs", "notification"]
    environment:
      NOTIFICATION_DATABASE_URL: postgresql://notification_svc:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    cpus: 0.5

  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    cpus: 0.25

  auth:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-auth:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args:
        APP: auth
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      AUTH_DATABASE_URL: postgresql://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/auth
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_PRIVATE_KEY_PATH: /run/ticketforge/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /run/ticketforge/keys/public.pem
      JWT_KEY_ID: ${JWT_KEY_ID:?Set JWT_KEY_ID in the VM env file}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the VM env file}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in the VM env file}
    volumes:
      - ${KEYS_DIR:?Set KEYS_DIR in the VM env file}/private.pem:/run/ticketforge/keys/private.pem:ro
      - ${KEYS_DIR:?Set KEYS_DIR in the VM env file}/public.pem:/run/ticketforge/keys/public.pem:ro
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5

  catalog:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-catalog:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args:
        APP: catalog
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      CATALOG_DATABASE_URL: postgresql://catalog_svc:${CATALOG_DB_PASSWORD}@postgres:5432/catalog
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_PUBLIC_KEY_PATH: /run/ticketforge/keys/public.pem
      JWT_KEY_ID: ${JWT_KEY_ID:?Set JWT_KEY_ID in the VM env file}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the VM env file}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in the VM env file}
    volumes:
      - ${KEYS_DIR:?Set KEYS_DIR in the VM env file}/public.pem:/run/ticketforge/keys/public.pem:ro
    depends_on:
      migrate-catalog:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5

  booking:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-booking:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args:
        APP: booking
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      BOOKING_DATABASE_URL: postgresql://booking_svc:${BOOKING_DB_PASSWORD}@postgres:5432/booking
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      QR_SECRET: ${QR_SECRET:?Set QR_SECRET in the VM env file}
      JWT_PUBLIC_KEY_PATH: /run/ticketforge/keys/public.pem
      JWT_KEY_ID: ${JWT_KEY_ID:?Set JWT_KEY_ID in the VM env file}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the VM env file}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in the VM env file}
    volumes:
      - ${KEYS_DIR:?Set KEYS_DIR in the VM env file}/public.pem:/run/ticketforge/keys/public.pem:ro
    depends_on:
      migrate-booking:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5

  payment:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-payment:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args:
        APP: payment
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      PAYMENT_DATABASE_URL: postgresql://payment_svc:${PAYMENT_DB_PASSWORD}@postgres:5432/payment
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET in the VM env file}
      DEMO_MODE: ${DEMO_MODE:-false}
      JWT_PUBLIC_KEY_PATH: /run/ticketforge/keys/public.pem
      JWT_KEY_ID: ${JWT_KEY_ID:?Set JWT_KEY_ID in the VM env file}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the VM env file}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in the VM env file}
    volumes:
      - ${KEYS_DIR:?Set KEYS_DIR in the VM env file}/public.pem:/run/ticketforge/keys/public.pem:ro
    depends_on:
      migrate-payment:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5

  notification:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-notification:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args:
        APP: notification
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      NOTIFICATION_DATABASE_URL: postgresql://notification_svc:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SMTP_URL: smtp://mailpit:1025
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-TicketForge <tickets@ticketforge.local>}
    depends_on:
      migrate-notification:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5

  gateway:
    image: ${IMAGE_PREFIX:-ticketforge}/ticketforge-gateway:${TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args:
        APP: gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth:3001
      CATALOG_SERVICE_URL: http://catalog:3002
      BOOKING_SERVICE_URL: http://booking:3003
      PAYMENT_SERVICE_URL: http://payment:3004
      NOTIFICATION_SERVICE_URL: http://notification:3005
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_PUBLIC_KEY_PATH: /run/ticketforge/keys/public.pem
      JWT_KEY_ID: ${JWT_KEY_ID:?Set JWT_KEY_ID in the VM env file}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the VM env file}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in the VM env file}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in the VM env file}
      LOAD_TEST_ALLOWLIST: ${LOAD_TEST_ALLOWLIST:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${KEYS_DIR:?Set KEYS_DIR in the VM env file}/public.pem:/run/ticketforge/keys/public.pem:ro
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      booking:
        condition: service_healthy
      payment:
        condition: service_healthy
      notification:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5

volumes:
  postgres_data:
    name: compose_postgres_data
    external: true
  redis_data:
  rabbitmq_data:
    name: 10d835084a36956a2ba92b3db341f7afd99b24b18188e6cf2d5f4898559e87c3
    external: true