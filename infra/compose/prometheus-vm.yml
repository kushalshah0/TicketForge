global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ticketforge
    metrics_path: /metrics
    static_configs:
      - targets:
          - "gateway:3000"
          - "auth:3001"
          - "catalog:3002"
          - "booking:3003"
          - "payment:3004"
          - "notification:3005"

  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
