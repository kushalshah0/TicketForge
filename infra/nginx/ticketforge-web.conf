location = /ticketforge {
    return 301 /ticketforge/;
}

location ^~ /ticketforge/ {
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    root /srv/web;
    try_files $uri $uri/ /ticketforge/index.html;
}
