name: Scheduled checks

on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  health:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check production API health
        run: curl --fail --silent --show-error --max-time 20 https://kushal.runs-on.dev/api/health

  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, auth, catalog, booking, payment, notification]
    steps:
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Scan deployed image tag
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ env.OWNER }}/ticketforge-${{ matrix.image }}:main
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
