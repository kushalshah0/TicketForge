name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  release-plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Select changed release targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_backend: ${{ steps.plan.outputs.has_backend }}
      web: ${{ steps.plan.outputs.web }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-plan

      - name: Validate release plan and create image matrix
        id: plan
        env:
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          const allowed = ['auth', 'booking', 'catalog', 'gateway', 'notification', 'payment'];
          const plan = JSON.parse(readFileSync('release-plan/release-plan.json', 'utf8'));
          if (!Array.isArray(plan.services) || typeof plan.web !== 'boolean' ||
              plan.services.some((service) => !allowed.includes(service)) ||
              new Set(plan.services).size !== plan.services.length) {
            throw new Error('Invalid production release plan');
          }
          const matrix = plan.services.flatMap((app) => [
            { app, target: 'runtime', suffix: '' },
            ...(app === 'gateway' ? [] : [{ app, target: 'migration', suffix: '-migrate' }]),
          ]);
          writeFileSync('release-plan/release-plan.json', JSON.stringify({
            ...plan,
            source_event: process.env.UPSTREAM_EVENT,
            source_repository: process.env.UPSTREAM_REPOSITORY,
            source_sha: process.env.UPSTREAM_SHA,
          }, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `matrix=${JSON.stringify({ include: matrix })}`,
            `has_backend=${matrix.length > 0}`,
            `web=${plan.web}`,
            '',
          ].join('\n'));
          NODE

      - name: Forward release plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan/release-plan.json
          if-no-files-found: error

  images:
    needs: release-plan
    if: needs.release-plan.outputs.has_backend == 'true'
    name: Build and push ${{ matrix.app }}${{ matrix.suffix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          build-args: APP=${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/ticketforge-${{ matrix.app }}${{ matrix.suffix }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ env.OWNER }}/ticketforge-${{ matrix.app }}${{ matrix.suffix }}:main
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.target }}

  web:
    needs: release-plan
    if: needs.release-plan.outputs.web == 'true'
    name: Build web artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run build:web -- --base=/ticketforge/
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
