name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success'
    name: Build and push ${{ matrix.app }}${{ matrix.suffix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: gateway
            target: runtime
            suffix: ''
          - app: auth
            target: runtime
            suffix: ''
          - app: catalog
            target: runtime
            suffix: ''
          - app: booking
            target: runtime
            suffix: ''
          - app: payment
            target: runtime
            suffix: ''
          - app: notification
            target: runtime
            suffix: ''
          - app: auth
            target: migration
            suffix: -migrate
          - app: catalog
            target: migration
            suffix: -migrate
          - app: booking
            target: migration
            suffix: -migrate
          - app: payment
            target: migration
            suffix: -migrate
          - app: notification
            target: migration
            suffix: -migrate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          build-args: APP=${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/ticketforge-${{ matrix.app }}${{ matrix.suffix }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ env.OWNER }}/ticketforge-${{ matrix.app }}${{ matrix.suffix }}:main
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.target }}

  web:
    name: Build web artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run build:web -- --base=/ticketforge/
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
